# Prefer editing group_vars/all/atlas-infra-edge.secrets.yml (Vault-friendly canonical overlay).
# Standalone EXTRA_VARS_FILE alternative:
#   cp examples/secrets.example.yml /path/to/secrets.yml   # keep outside git if plaintext
#   # fill values, optionally: ansible-vault encrypt /path/to/secrets.yml
#   EXTRA_VARS_FILE=/path/to/secrets.yml ./run.sh
#

# Example secrets overlay for ./run.sh
# Usage:
#   cp examples/secrets.example.yml /path/to/secrets.yml   # keep outside git
#   # fill values, optionally: ansible-vault encrypt /path/to/secrets.yml
#   EXTRA_VARS_FILE=/path/to/secrets.yml ./run.sh
#
# These keys override group_vars/all/atlas-infra-edge.yml. Do not commit real secrets.

# BIND TSIG placeholders (required when setup_bind: true).
# Consumed by group_vars bind_zones.*.tsig_secret defaults.
bind_apex_tsig_secret: "CHANGEME"
bind_k8s_tsig_secret: "CHANGEME"
bind_istio_tsig_secret: "CHANGEME"

# step-ca bootstrap (required when setup_stepca: true)
stepca_init_password: "CHANGEME"

# Infra cache sync over SSH password auth (only when nginx_cache_sync_ssh_auth: password)
# nginx_cache_sync_ssh_password: "CHANGEME"
# nginx_cache_sync_remote_host: "192.0.2.20"

# Infra cache OCI seed robots (when infra_cache_seed_publish_enabled / _load_enabled).
# Push and pull accounts are independent. Seed registry must be external.
# Load user/password may both be empty for anonymous pull (public Docker Hub).
# infra_cache_seed_publish_registry_user: "CHANGEME"
# infra_cache_seed_publish_registry_password: "CHANGEME"
# infra_cache_seed_load_registry_user: "CHANGEME"
# infra_cache_seed_load_registry_password: "CHANGEME"
