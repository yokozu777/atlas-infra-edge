---
# Reject empty / placeholder secrets when the matching feature gate is on.

- name: Assert bind_zones mapping when setup_bind is enabled
  ansible.builtin.assert:
    that:
      - bind_zones is mapping
      - bind_zones | length > 0
    fail_msg: >-
      setup_bind=true requires a non-empty bind_zones mapping
      (see group_vars/all/atlas-infra-edge.yml)
  when: setup_bind | default(false) | bool

- name: Assert each bind_zones entry shape
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value.name | default('') | trim | length > 0
      - item.value.tsig_key_name | default('') | trim | length > 0
      - item.value.tsig_secret | default('') | trim | length > 0
      - item.value.tsig_secret | trim | upper != 'CHANGEME'
      - (item.value.update_mode | default('zonesub')) in ['allow-update', 'zonesub']
    fail_msg: >-
      bind_zones.{{ item.key }} needs name, tsig_key_name, real tsig_secret
      (not CHANGEME), and update_mode in [allow-update, zonesub]
  loop: "{{ bind_zones | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: setup_bind | default(false) | bool

- name: Assert bind_zones names are unique
  ansible.builtin.assert:
    that:
      - (bind_zones | dict2items | map(attribute='value.name') | list | length)
        == (bind_zones | dict2items | map(attribute='value.name') | list | unique | length)
    fail_msg: bind_zones.*.name values must be unique
  when: setup_bind | default(false) | bool

- name: Assert bind_zones TSIG key names are unique
  ansible.builtin.assert:
    that:
      - (bind_zones | dict2items | map(attribute='value.tsig_key_name') | list | length)
        == (bind_zones | dict2items | map(attribute='value.tsig_key_name') | list | unique | length)
    fail_msg: bind_zones.*.tsig_key_name values must be unique
  when: setup_bind | default(false) | bool

- name: Assert step-ca init password when setup_stepca is enabled
  ansible.builtin.assert:
    that:
      - stepca_init_password | default('') | trim | length > 0
      - stepca_init_password | trim | upper != 'CHANGEME'
    fail_msg: >-
      setup_stepca=true requires a real stepca_init_password
      (replace CHANGEME via group_vars or EXTRA_VARS_FILE / vault)
  when: setup_stepca | default(false) | bool
