---
# Pull modes + derived gate consistency (do not override derived flags manually).

- name: Assert use_internal_rpm_apt_repo is valid when set
  ansible.builtin.assert:
    that:
      - use_internal_rpm_apt_repo | default('none') in ['none', 'nexus', 'nginx']
    fail_msg: >-
      use_internal_rpm_apt_repo must be one of: none, nexus, nginx
      (got {{ use_internal_rpm_apt_repo | default('none') }}).
      Legacy label only — does not enable the mirror. APT/RPM nginx deploy
      gate is setup_pkg_repo_nginx alone; client drop-ins use leaf pkg_repos.

- name: Assert setup_apt_rpm_nginx matches setup_pkg_repo_nginx
  ansible.builtin.assert:
    that:
      - (setup_apt_rpm_nginx | default(false) | bool) == (setup_pkg_repo_nginx | default(false) | bool)
    fail_msg: >-
      setup_apt_rpm_nginx must equal setup_pkg_repo_nginx (Phase 3 infra-local
      mirror gate). Prefer setup_apt_rpm_nginx: "{{ setup_pkg_repo_nginx }}"
      and do not derive it from use_internal_rpm_apt_repo.

- name: Assert setup_pkg_repo_nginx when legacy client mode is nginx
  ansible.builtin.assert:
    that:
      - setup_pkg_repo_nginx | default(false) | bool
    fail_msg: >-
      use_internal_rpm_apt_repo=nginx requires setup_pkg_repo_nginx=true
      (mirror deploy is infra-local since Phase 3).
  when: use_internal_rpm_apt_repo | default('none') == 'nginx'

- name: Assert nexus variables when legacy package repo mode is nexus
  ansible.builtin.assert:
    that:
      - nexus_base_url | default('') | length > 0
      - nexus_host | default('') | length > 0
    fail_msg: nexus_base_url and nexus_host are required when use_internal_rpm_apt_repo=nexus
  when: use_internal_rpm_apt_repo | default('none') == 'nexus'

- name: Assert nginx package repo variables when mirror is enabled
  ansible.builtin.assert:
    that:
      - pkg_repo_nginx_ingress_domain | default('') | length > 0
      - pkg_repo_upstreams | default([]) | length > 0
      - setup_stepca | default(false) | bool
      - pkg_repo_tls_enabled | default(false) | bool
    fail_msg: >-
      pkg_repo_nginx_ingress_domain, pkg_repo_upstreams, setup_stepca=true and
      pkg_repo_tls_enabled=true are required when setup_pkg_repo_nginx=true
  when: setup_pkg_repo_nginx | default(false) | bool

- name: Assert use_internal_helm_repo is valid
  ansible.builtin.assert:
    that:
      - use_internal_helm_repo | default('none') in ['none', 'nexus', 'nginx']
    fail_msg: >-
      use_internal_helm_repo must be one of: none, nexus, nginx
      (got {{ use_internal_helm_repo | default('none') }})

- name: Assert setup_helm_nginx matches Helm repo mode
  ansible.builtin.assert:
    that:
      - (setup_helm_nginx | default(false) | bool) == ((use_internal_helm_repo == 'nginx') and (setup_helm_repo_nginx | default(false) | bool))
    fail_msg: >-
      setup_helm_nginx must equal
      (use_internal_helm_repo == 'nginx' and setup_helm_repo_nginx=true);
      do not override manually in group_vars/all/atlas-infra-edge.yml

- name: Assert setup_helm_repo_nginx when Helm client mode is nginx
  ansible.builtin.assert:
    that:
      - setup_helm_repo_nginx | default(false) | bool
    fail_msg: use_internal_helm_repo=nginx requires setup_helm_repo_nginx=true
  when: use_internal_helm_repo | default('none') == 'nginx'

- name: Assert nexus variables when Helm repo mode is nexus
  ansible.builtin.assert:
    that:
      - nexus_base_url | default('') | length > 0
      - nexus_host | default('') | length > 0
    fail_msg: nexus_base_url and nexus_host are required when use_internal_helm_repo=nexus
  when: use_internal_helm_repo | default('none') == 'nexus'

- name: Assert nginx Helm repo variables when mode is nginx
  ansible.builtin.assert:
    that:
      - helm_repo_nginx_ingress_domain | default('') | length > 0
      - helm_repo_upstreams | default([]) | length > 0
      - setup_stepca | default(false) | bool
      - helm_repo_tls_enabled | default(false) | bool
    fail_msg: >-
      helm_repo_nginx_ingress_domain, helm_repo_upstreams, setup_stepca=true and
      helm_repo_tls_enabled=true are required when use_internal_helm_repo=nginx and setup_helm_repo_nginx=true
  when:
    - use_internal_helm_repo | default('none') == 'nginx'
    - setup_helm_repo_nginx | default(false) | bool

- name: Assert use_internal_docker_registry is valid
  ansible.builtin.assert:
    that:
      - use_internal_docker_registry | default('none') in ['none', 'harbor', 'registry']
    fail_msg: >-
      use_internal_docker_registry must be one of: none, harbor, registry
      (got {{ use_internal_docker_registry | default('none') }})

- name: Assert setup_registry flags match use_internal_docker_registry
  ansible.builtin.assert:
    that:
      - (setup_registry | default(false) | bool) == (use_internal_docker_registry == 'registry')
      - (setup_registry_nginx | default(false) | bool) == (use_internal_docker_registry == 'registry')
    fail_msg: >-
      setup_registry and setup_registry_nginx must equal
      (use_internal_docker_registry == 'registry'); do not override them manually in group_vars

- name: Assert harbor variables when pull mode is harbor
  ansible.builtin.assert:
    that:
      - harbor_host | default('') | length > 0
      - harbor_mirror_base | default('') | length > 0
    fail_msg: harbor_host and harbor_mirror_base are required when use_internal_docker_registry=harbor
  when: use_internal_docker_registry | default('none') == 'harbor'

- name: Assert registry variables when pull mode is registry
  ansible.builtin.assert:
    that:
      - registry_ingress_domain | default('') | length > 0
      - containerd_registry_mirrors | default([]) | length > 0
      - setup_stepca | default(false) | bool
      - registry_tls_enabled | default(false) | bool
    fail_msg: >-
      registry_ingress_domain, containerd_registry_mirrors, setup_stepca=true and
      registry_tls_enabled=true are required when use_internal_docker_registry=registry
  when: use_internal_docker_registry | default('none') == 'registry'

- name: Assert get_snapshotter is valid
  ansible.builtin.assert:
    that:
      - get_snapshotter | default('github') in ['github', 'private-git', 'internal-nginx']
    fail_msg: >-
      get_snapshotter must be one of: github, private-git, internal-nginx
      (got {{ get_snapshotter | default('github') }})

- name: Assert setup_custom_content_nginx matches get_snapshotter
  ansible.builtin.assert:
    that:
      - (setup_custom_content_nginx | default(false) | bool) == ((get_snapshotter | default('github') == 'internal-nginx') and (setup_custom_nginx | default(false) | bool))
    fail_msg: >-
      setup_custom_content_nginx must equal
      (get_snapshotter == 'internal-nginx' and setup_custom_nginx=true);
      do not override manually in group_vars/all/atlas-infra-edge.yml

- name: Assert setup_custom_nginx when snapshotter mode is internal-nginx
  ansible.builtin.assert:
    that:
      - setup_custom_nginx | default(false) | bool
    fail_msg: get_snapshotter=internal-nginx requires setup_custom_nginx=true
  when: get_snapshotter | default('github') == 'internal-nginx'

- name: Assert custom nginx variables when snapshotter mode is internal-nginx
  ansible.builtin.assert:
    that:
      - custom_nginx_ingress_domain | default('') | length > 0
      - setup_stepca | default(false) | bool
      - custom_nginx_tls_enabled | default(false) | bool
    fail_msg: >-
      custom_nginx_ingress_domain, setup_stepca=true and custom_nginx_tls_enabled=true are required
      when get_snapshotter=internal-nginx and setup_custom_nginx=true
  when:
    - get_snapshotter | default('github') == 'internal-nginx'
    - setup_custom_nginx | default(false) | bool

- name: Assert registry nginx when custom content is shared with registry ingress
  ansible.builtin.assert:
    that:
      - setup_registry_nginx | default(false) | bool
    fail_msg: >-
      get_snapshotter=internal-nginx with custom_nginx_shared_with_registry=true requires
      setup_registry_nginx=true (custom static vhost is served via registry-nginx SNI)
  when:
    - get_snapshotter | default('github') == 'internal-nginx'
    - setup_custom_nginx | default(false) | bool
    - custom_nginx_shared_with_registry | default(true) | bool

- name: Assert registry nginx and step-ca when infra-stats is enabled
  ansible.builtin.assert:
    that:
      - setup_registry_nginx | default(false) | bool
      - infra_stats_shared_with_registry | default(true) | bool
      - setup_stepca | default(false) | bool
      - infra_stats_tls_enabled | default(false) | bool
      - infra_stats_hostname | default('') | length > 0
    fail_msg: >-
      setup_infra_stats requires setup_registry_nginx=true,
      infra_stats_shared_with_registry=true, setup_stepca=true,
      infra_stats_tls_enabled=true, and a non-empty infra_stats_hostname
  when: setup_infra_stats | default(false) | bool
