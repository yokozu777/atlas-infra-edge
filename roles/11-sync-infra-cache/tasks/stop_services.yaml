      changed_when: false
      failed_when: false
      when: setup_compose_systemd | default(false) | bool

    - name: Probe standalone pkg-repo nginx compose containers before cache sync stop
      ansible.builtin.command:
        cmd: docker compose ps -q
        chdir: "{{ pkg_repo_nginx_compose_project_dir }}"
      register: nginx_cache_sync_pkg_repo_ps_probe
      changed_when: false
      failed_when: false
      when: >-
        not (setup_compose_systemd | default(false) | bool)
        or (nginx_cache_sync_pkg_repo_probe.stdout | default('') == 'active')

    - name: Stop standalone pkg-repo nginx compose project before infra cache sync
      ansible.builtin.command:
        cmd: docker compose stop
        chdir: "{{ pkg_repo_nginx_compose_project_dir }}"
      when: >-
        (setup_compose_systemd | default(false) | bool
         and nginx_cache_sync_pkg_repo_probe.stdout | default('') == 'active')
        or (
          not (setup_compose_systemd | default(false) | bool)
          and (nginx_cache_sync_pkg_repo_ps_probe.stdout | default('') | trim | length > 0)
