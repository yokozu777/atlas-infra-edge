    - name: Probe standalone custom nginx compose containers before cache sync stop
      ansible.builtin.command:
        cmd: docker compose ps -q
        chdir: "{{ custom_nginx_compose_project_dir }}"
      register: nginx_cache_sync_custom_nginx_ps_probe
      changed_when: false
      failed_when: false
      when: >-
