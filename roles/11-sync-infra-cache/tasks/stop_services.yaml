- name: Stop registry compose stack before infra cache sync
  when:
    - nginx_cache_sync_registry_enabled | bool
    - >-
      (setup_compose_systemd | default(false) | bool
       and nginx_cache_sync_registry_probe.stdout | default('') == 'active')
      or (
        not (setup_compose_systemd | default(false) | bool)
