      changed_when: false
      failed_when: false

    - name: Mark standalone pkg-repo nginx compose unit stopped before infra cache sync
      ansible.builtin.systemd:
        name: "{{ compose_systemd_pkg_repo_nginx_unit_name }}.service"
        state: stopped
      when:
        - setup_compose_systemd | default(false) | bool
        - nginx_cache_sync_pkg_repo_probe.stdout | default('') == 'active'
      failed_when: false

    - name: Record standalone pkg-repo nginx was stopped for cache sync
      ansible.builtin.set_fact:
        nginx_cache_sync_stopped_pkg_repo_nginx: true
      when: >-
        (setup_compose_systemd | default(false) | bool
         and nginx_cache_sync_pkg_repo_probe.stdout | default('') == 'active')
        or (
          not (setup_compose_systemd | default(false) | bool)
          and (nginx_cache_sync_pkg_repo_ps_probe.stdout | default('') | trim | length > 0)
        )

