---
# Bootstrap package-repo state on the infra platform host.
# Override infra_bootstrap_repo_state_dir in inventory / group_vars when needed.
infra_bootstrap_public_pkg_repos: true
infra_bootstrap_repo_state_dir: /var/lib/atlas-infra
infra_bootstrap_repo_marker: "{{ infra_bootstrap_repo_state_dir }}/infra-bootstrap-repos.done"
infra_bootstrap_repo_backup_dir: "{{ infra_bootstrap_repo_state_dir }}/repo-backup"

docker_apt_key_path: /etc/apt/keyrings/docker.asc
docker_apt_public_key_url_debian: https://download.docker.com/linux/debian/gpg
docker_apt_public_key_url_ubuntu: https://download.docker.com/linux/ubuntu/gpg
docker_apt_public_debian_base: https://download.docker.com/linux/debian
docker_apt_public_ubuntu_base: https://download.docker.com/linux/ubuntu
docker_dnf_public_repo_url: https://download.docker.com/linux/centos/docker-ce.repo
docker_dnf_public_repo_filename: docker-ce
