---
- name: Ensure infra cache seed stamp parent directory exists
  ansible.builtin.file:
    path: "{{ infra_cache_seed_load_stamp_path | dirname }}"
    state: directory
    mode: "0755"

- name: Require infra cache seed digest before writing stamp
  ansible.builtin.assert:
    that:
      - (infra_cache_seed_image_digest | default('') | length) > 0
    fail_msg: Cannot write infra cache seed stamp without a pulled RepoDigest.

- name: Build infra cache seed stamp document
  ansible.builtin.set_fact:
    infra_cache_seed_stamp_doc: >-
      {{
        {
          'version': 1,
          'image': infra_cache_seed_image | string,
          'tag': infra_cache_seed_tag | string,
          'digest': infra_cache_seed_image_digest | string,
          'components': (infra_cache_seed_components | default([]) | map(attribute='name') | list),
          'loaded_at': ansible_date_time.iso8601 | default('') | string
        }
      }}

- name: Write local infra cache seed stamp after successful load
  ansible.builtin.copy:
    dest: "{{ infra_cache_seed_load_stamp_path }}"
    mode: "0644"
    content: "{{ infra_cache_seed_stamp_doc | to_nice_yaml(indent=2) }}"
  register: infra_cache_seed_stamp_write

- name: Log infra cache seed stamp update
  ansible.builtin.debug:
    msg: >-
      atlas_infra_cache_seed stamp_written
      path={{ infra_cache_seed_load_stamp_path }}
      digest={{ infra_cache_seed_image_digest | truncate(80, true, '') }}
      changed={{ infra_cache_seed_stamp_write.changed | default(false) }}
