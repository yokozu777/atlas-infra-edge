---
# Restore restart intent from a previous incomplete load/publish (crash after stop).

- name: Stat infra cache seed services hold
  ansible.builtin.stat:
    path: "{{ infra_cache_seed_services_hold_path }}"
  register: infra_cache_seed_services_hold_stat

- name: Load infra cache seed services hold
  when: infra_cache_seed_services_hold_stat.stat.exists | default(false)
  block:
    - name: Read infra cache seed services hold
      ansible.builtin.slurp:
        path: "{{ infra_cache_seed_services_hold_path }}"
      register: infra_cache_seed_services_hold_slurp

    - name: Decode infra cache seed services hold
      ansible.builtin.set_fact:
        infra_cache_seed_services_hold_data: "{{ infra_cache_seed_services_hold_slurp.content | b64decode | from_yaml }}"

    - name: Require infra cache seed hold mapping
      ansible.builtin.assert:
        that:
          - infra_cache_seed_services_hold_data is mapping
        fail_msg: infra cache seed services hold is not a mapping
  rescue:
    - name: Ignore unreadable infra cache seed services hold
      ansible.builtin.set_fact:
        infra_cache_seed_services_hold_data: {}

- name: Merge infra cache seed services hold into restart intent
  ansible.builtin.set_fact:
    infra_cache_seed_stopped: "{{ (infra_cache_seed_stopped | default({})) | combine(infra_cache_seed_services_hold_data) }}"
  when:
    - infra_cache_seed_services_hold_stat.stat.exists | default(false)
    - infra_cache_seed_services_hold_data is defined
    - infra_cache_seed_services_hold_data is mapping
    - (infra_cache_seed_services_hold_data | length) > 0

- name: Log infra cache seed services hold restore
  ansible.builtin.debug:
    msg: >-
      atlas_infra_cache_seed services_hold_restored
      path={{ infra_cache_seed_services_hold_path }}
      stopped={{ infra_cache_seed_stopped | default({}) | dict2items | selectattr('value') | map(attribute='key') | list }}
  when:
    - infra_cache_seed_services_hold_stat.stat.exists | default(false)
    - (infra_cache_seed_stopped | default({}) | length) > 0
