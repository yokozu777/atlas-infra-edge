---
# Held keys must map to current stop targets and actually be running.
# Compose ps is the liveness signal when project_dir exists (RemainAfterExit
# is-active is not enough). systemd is-active is only used when there is no
# compose project. started_ok is set only after every held key passes.

- name: Reset infra cache seed started-ok before assert
  ansible.builtin.set_fact:
    infra_cache_seed_started_ok: false

- name: Require held seed services to map to current stop targets
  ansible.builtin.assert:
    that:
      - item.key in (infra_cache_seed_stop_targets | default([]) | map(attribute='name') | list)
    fail_msg: >-
      infra cache seed hold lists {{ item.key }} which is not in the current
      stop targets; refusing to clear the hold
  loop: "{{ infra_cache_seed_stopped | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value | default(false) | bool

- ansible.builtin.include_tasks: assert_one_started.yaml
  loop: "{{ infra_cache_seed_stop_targets | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: (infra_cache_seed_stopped | default({})).get(item.name, false) | bool

- name: Mark infra cache seed restart confirmed
  ansible.builtin.set_fact:
    infra_cache_seed_started_ok: true
