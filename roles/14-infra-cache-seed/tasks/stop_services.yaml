---
# Stop only units that are actually running (cold path = no-op).
# Reset then restore hold so a previous crash still restarts inactive units.

- name: Reset infra cache seed stop bookkeeping
  ansible.builtin.set_fact:
    infra_cache_seed_stopped: {}

- ansible.builtin.include_tasks: load_services_hold.yaml

- name: Stop running stacks before infra cache seed mutation
  ansible.builtin.include_tasks: stop_one.yaml
  loop: "{{ infra_cache_seed_stop_targets | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - infra_cache_seed_stop_services | default(true) | bool
    - (infra_cache_seed_stop_targets | default([]) | length) > 0

- name: Ensure infra cache seed services hold parent directory exists
  ansible.builtin.file:
    path: "{{ infra_cache_seed_services_hold_path | dirname }}"
    state: directory
    mode: "0755"
  when: (infra_cache_seed_stopped | default({}) | length) > 0

- name: Write infra cache seed services hold after stop
  ansible.builtin.copy:
    dest: "{{ infra_cache_seed_services_hold_path }}"
    mode: "0644"
    content: "{{ infra_cache_seed_stopped | to_nice_yaml(indent=2) }}"
  when: (infra_cache_seed_stopped | default({}) | length) > 0
