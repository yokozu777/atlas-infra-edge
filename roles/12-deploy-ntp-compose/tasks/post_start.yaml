---
# Phase 1 post_start: wait until NTP container is up and chrony is synchronized.

- name: Wait for NTP container to reach running state
  ansible.builtin.shell: docker ps --filter name=^{{ ntp_container_name }}$ --filter status=running -q
  register: ntp_container_status
  until: ntp_container_status.stdout | trim | length > 0
  retries: "{{ ntp_ready_retries | default(12) }}"
  delay: "{{ ntp_ready_delay | default(5) }}"
  changed_when: false

- name: Wait for NTP server synchronization inside container
  ansible.builtin.command:
    cmd: >-
      docker exec {{ ntp_container_name }}
      chronyc -a waitsync
      {{ ntp_waitsync_max_seconds | default(30) }}
      {{ ntp_max_offset_seconds | default(0.5) }}
  register: ntp_waitsync
  until: ntp_waitsync.rc == 0
  retries: "{{ ntp_ready_retries | default(12) }}"
  delay: "{{ ntp_ready_delay | default(5) }}"
  changed_when: false
