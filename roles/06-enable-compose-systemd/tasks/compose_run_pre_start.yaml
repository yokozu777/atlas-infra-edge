---
# Nested from compose_start_group.yaml — runs pre_start hooks for one stack.
- name: Run pre_start hook for compose stack
  ansible.builtin.include_role:
    name: "{{ compose_pre_start_stack.role }}"
    tasks_from: "{{ hook }}"
  loop: "{{ compose_pre_start_stack.pre_start | default([]) }}"
  loop_control:
    loop_var: hook
    label: "{{ compose_pre_start_stack.id }}/{{ hook }}"
