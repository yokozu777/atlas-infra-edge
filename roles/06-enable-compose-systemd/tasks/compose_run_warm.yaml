---
# Nested from compose_start_group.yaml — runs warm hooks for one stack.
- name: Run warm hook for compose stack
  ansible.builtin.include_role:
    name: "{{ compose_warm_stack.role }}"
    tasks_from: "{{ hook }}"
  loop: "{{ compose_warm_stack.warm | default([]) }}"
  loop_control:
    loop_var: hook
    label: "{{ compose_warm_stack.id }}/{{ hook }}"
