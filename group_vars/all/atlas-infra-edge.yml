nginx_cache_sync_stop_services: true
nginx_cache_sync_rsync_compress: true
nginx_cache_sync_min_free_gb: 5
nginx_cache_sync_warm_after_pull: true
# Skip rsync when local mirror is younger than max age (role 11-sync-infra-cache).
nginx_cache_sync_skip_if_fresh: false
nginx_cache_sync_fresh_max_age_hours: 24

# =============================================================================
# OPTIONAL — Infra cache OCI seed (role 14-infra-cache-seed)
# =============================================================================
# Two independent layers. XOR with nginx_cache_sync_enabled on LOAD
# (01_validate_vars fails if both load and rsync are on).
# Publish packs host bind-mounts into a busybox image; load docker-pulls it
# and copies selected trees onto /opt before compose_start_registry.
# Seed registry must be EXTERNAL (reachable after core, before local Harbor).
# Robot creds → atlas-infra-edge.secrets.yml (never in this catalog).
# Load user/password may both be empty (anonymous pull, e.g. public Docker Hub).
# Tags must be immutable (not latest). TLS certs/ are never packed.
# Load skip compares pulled RepoDigest + non-empty dest trees (not tag).
# Publish is opt-in (--tags 14_infra_cache_seed_publish), not a default play slot.
# Builder busybox:1.36 must exist on the donor (pull or preload); site may pin a digest.

infra_cache_seed_publish_enabled: false
infra_cache_seed_publish_image: ""
infra_cache_seed_publish_tag: ""
infra_cache_seed_publish_include:
  registry: true
  helm_repo: true
  pkg_repo: true
  custom_www: true

infra_cache_seed_load_enabled: false
infra_cache_seed_load_image: ""
infra_cache_seed_load_tag: ""
infra_cache_seed_load_include:
  registry: true
  helm_repo: true
  pkg_repo: true
  custom_www: true

infra_cache_seed_builder_image: busybox:1.36
infra_cache_seed_publish_timeout_sec: 14400
infra_cache_seed_load_timeout_sec: 7200
infra_cache_seed_min_free_gb: 5
infra_cache_seed_stop_services: true
infra_cache_seed_load_skip_if_same_digest: true
infra_cache_seed_load_stamp_path: "{{ infra_bootstrap_repo_state_dir | default('/var/lib/atlas-infra') }}/cache-seed.stamp"
infra_cache_seed_nginx_uid: 101
infra_cache_seed_nginx_gid: 101
# Docker certs.d CA for the seed registry (login/pull/push). Off: public CA / OS trust.
# XOR src vs dir when enabled (URL/host path vs controller playbook_dir folder).
infra_cache_seed_registry_tls_ca_enabled: false
infra_cache_seed_registry_tls_ca_src: ""
infra_cache_seed_registry_tls_ca_dir: ""
infra_cache_seed_registry_tls_ca_validate_certs: false

# =============================================================================
# OPTIONAL — Compose systemd units
# =============================================================================

compose_systemd_unit_dir: /etc/systemd/system
compose_systemd_bind_unit_name: bind-compose
compose_systemd_ntp_unit_name: ntp-compose
compose_systemd_stepca_unit_name: stepca-compose

