[defaults]
filter_plugins = ./filter_plugins
host_key_checking = false
forks = 50
interpreter_python = auto
callbacks_enabled = timer, profile_tasks, profile_roles
gather_facts = false
gathering = explicit
roles_path = roles
# Cacheable set_fact (pkg_repo_cache_warm_pending, compose pending restart, …) must
# survive separate ansible-playbook --tags invocations. ./run.sh sets
# ANSIBLE_CACHE_PLUGIN_CONNECTION to <workspace>/.ansible_facts_cache; the path
# below is a safe default for ad-hoc ansible-playbook from the repo root.
fact_caching = jsonfile
fact_caching_connection = ./workspace/.ansible_facts_cache
fact_caching_timeout = 86400

[ssh_connection]
pipelining = true
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m
